<html>
<head>
  <title>Zvuk Downloader</title>
  <link rel="stylesheet" href="popup.css">
  <script src="lib/xlsx.full.min.js"></script>
</head>
<body>
  <div id="not-on-zvuk" style="display: none;">
    <p>Works only on zvuk.com</p>
  </div>
  <div id="streams-container">
    <table id="streams-table">
      <thead>
        <tr>
          <th><input type="checkbox" id="select-all"></th>
          <th>Title</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="streams-body"></tbody>
    </table>
    <button id="download-selected">Download Selected</button>
    <button id="download-all">Download All</button>
    <button id="clear-streams">Clear Streams</button>
  </div>
  <script src="xlsxUtils.js"></script>
  <script src="popup.js"></script>
</body>
</html>
